[project]
name = "sosie"
version = "1.2.1"
description = "Fabrique un sosie fictif de données de recherche pour travailler avec l'IA sans lui montrer les vraies données."
readme = "LISEZMOI.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyreadstat>=1.2",
    "pyreadr>=0.5",
]

[project.scripts]
sosie = "sosie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sosie"]
